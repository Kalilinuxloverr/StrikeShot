name: StrikeShot
options:
  bundleIdPrefix: dev.leonfrohlich
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    GENERATE_INFOPLIST_FILE: YES
targets:
  StrikeShot:
    type: application
    platform: iOS
    sources:
      - StrikeShot
    dependencies:
      - target: StrikeShotWidgets
        embed: true
    info:
      path: StrikeShot/Info.plist
      properties:
        CFBundleDisplayName: StrikeShot
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "StrikeShot nutzt die Kamera, um Blitze automatisch zu fotografieren und zu filmen."
        NSMicrophoneUsageDescription: "StrikeShot hört nach dem Blitz auf den Donner, um die Entfernung des Einschlags zu berechnen."
        NSLocationWhenInUseUsageDescription: "StrikeShot zeigt Blitze in deiner Umgebung und warnt, wenn ein Gewitter näher kommt."
        NSPhotoLibraryAddUsageDescription: "StrikeShot speichert deine Blitz-Fotos und -Videos in der Fotomediathek."
        NSSupportsLiveActivities: true
        UIBackgroundModes: [remote-notification, fetch]
        # Blitzortung's public feed is plain ws:// on port 8080 — there is no TLS
        # endpoint, so the live map needs this narrow exception to reach it.
        NSAppTransportSecurity:
          NSExceptionDomains:
            blitzortung.org:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonfrohlich.strikeshot
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  StrikeShotWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - path: StrikeShot/Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: StrikeShot Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leonfrohlich.strikeshot.widgets
        TARGETED_DEVICE_FAMILY: "1"
  StrikeShotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: StrikeShot
